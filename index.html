<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fffafd">
<title>Music Playlist Editor</title>
<link rel="icon" type="image/png" href="MOMO.png">
<link rel="apple-touch-icon" href="MOMO.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=DM+Serif+Display&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --acc:#f4a4c8; --acc-rgb:244,164,200; --acc-deep:#e584b0; --acc-ink:#b25f86; --acc2:#e584b0;
  --grad:linear-gradient(135deg,var(--acc),var(--acc2)); --grad-soft:linear-gradient(135deg,var(--acc-bg),var(--acc-light));
  --bg-img:none; --card-bg:#ffffff; --title-font:var(--serif); --title-weight:400;
  --acc-bg:rgba(var(--acc-rgb),.10); --acc-light:rgba(var(--acc-rgb),.18); --acc-border:rgba(var(--acc-rgb),.32);
  --bg:#fffafd; --bg2:#fdf3f8; --card:#ffffff;
  --border:#fae8f0; --border2:#f5d7e4;
  --t1:#3a2230; --t2:#76566a; --t3:#b89aae;
  --sans:'Nunito','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --serif:'DM Serif Display','Pretendard',serif;
}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{font-family:var(--sans);background-color:var(--bg);background-image:var(--bg-img);background-attachment:fixed;color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .5s}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0}
.ic .f{fill:currentColor;stroke:none}

/* background */
.bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38}
.orb.o1{width:380px;height:380px;background:radial-gradient(circle,var(--acc) 0%,transparent 70%);top:-140px;left:-110px;animation:o1 24s ease-in-out infinite}
.orb.o2{width:340px;height:340px;background:radial-gradient(circle,var(--acc) 0%,transparent 70%);bottom:-140px;right:-120px;opacity:.26;animation:o2 28s ease-in-out infinite}
@keyframes o1{50%{transform:translate(70px,50px) scale(1.1)}}
@keyframes o2{50%{transform:translate(-60px,-40px) scale(.94)}}

.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px 60px}

/* top bar (outside the frame, not captured) */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 2px 14px}
.bar-label{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;color:var(--acc-deep);display:flex;align-items:center;gap:7px}
.bar-label::before{flex-shrink:0;content:'';width:5px;height:5px;border-radius:50%;background:var(--acc)}
.bar-btns{display:flex;gap:7px;flex-shrink:0}
.ico-btn{width:36px;height:36px;border-radius:12px;border:1.5px solid var(--border2);background:var(--card);color:var(--t2);display:flex;align-items:center;justify-content:center;transition:.18s}
.ico-btn:hover{border-color:var(--acc);color:var(--acc-deep);background:var(--acc-bg)}
.add-btn{white-space:nowrap;flex-shrink:0;height:36px;padding:0 15px;border-radius:12px;background:var(--grad);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;gap:5px;box-shadow:0 4px 14px rgba(var(--acc-rgb),.32);transition:.18s}
.add-btn:hover{filter:brightness(1.04);transform:translateY(-1px)}

/* ─── FRAME ─── */
#snap{padding:0}
.capturing #snap{padding:22px;background-color:var(--bg);background-image:var(--bg-img)}
.frame{position:relative;background:var(--card-bg);border:1.5px solid var(--border2);border-radius:28px;padding:26px 22px 20px;box-shadow:0 10px 40px rgba(var(--acc-rgb),.12)}
.capturing .frame{box-shadow:none}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;border-radius:inherit}
.names.one .link,.names.one #name-b{display:none}
.sb .seg.mt{margin-top:8px}
/* frame borders */
.frame.b-double::before,.frame.b-dashed::before{content:'';position:absolute;inset:7px;border-radius:21px;border:1.5px solid var(--border2);pointer-events:none}
.frame.b-dashed::before{border-style:dashed}
.frame.b-none{border-color:transparent}
.frame.b-thick{border-width:3px;border-color:var(--acc)}
/* lyrics align */
.lyr{position:relative;margin-top:12px;padding:22px 24px 18px;border-radius:18px;border:1px solid var(--border);background:var(--card)}
.lyr.center{text-align:center}
.q-mark{display:block;height:22px;font-family:'DM Serif Display',Georgia,serif;font-size:46px;line-height:1;color:var(--acc);opacity:.75;margin-bottom:6px;overflow:visible}
.q-text{font-size:15px;font-weight:600;line-height:1.8;color:var(--t1);white-space:pre-line;overflow-wrap:anywhere;word-break:keep-all}
.q-cite{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--t3);min-width:0}
.lyr.center .q-cite{justify-content:center}
.q-cite i{flex-shrink:0;width:16px;height:1.5px;background:var(--acc-border);display:block}
.q-cite span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr-edit{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t3)}
.lyr-edit:hover{background:var(--acc-bg);color:var(--acc-deep)}
.lyr-empty{padding:4px 0 2px;text-align:center;font-size:12px;font-weight:600;color:var(--t3)}
.lyr-empty button{margin-top:10px;height:30px;padding:0 12px;border-radius:10px;border:1.5px solid var(--border2);font-size:12px;font-weight:700;color:var(--t2)}
.lyr-empty button:hover{border-color:var(--acc);color:var(--acc-deep);background:var(--acc-bg)}
.r-artist{display:flex;align-items:center;gap:5px}
.r-artist>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* grid view */
#tracklist.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
#tracklist.grid .row{display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:6px;border-radius:16px}
#tracklist.grid .r-num{display:none}
#tracklist.grid .r-art{width:100%;height:auto;aspect-ratio:1/1;border-radius:13px}
#tracklist.grid .r-art .ic{width:24px;height:24px}
#tracklist.grid .r-title{font-size:12.5px;margin-bottom:1px}
#tracklist.grid .r-artist{font-size:10.5px}
#tracklist.grid .r-fav{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.9);border-radius:50%;width:26px;height:26px}
#tracklist.grid .r-more{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.9);border-radius:50%;width:26px;height:26px}
#tracklist.grid .empty{grid-column:1/-1}
#tracklist.grid .row.drop-above::before,#tracklist.grid .row.drop-below::after{top:8px;bottom:8px;left:auto;right:auto;width:2px;height:auto}
#tracklist.grid .row.drop-above::before{left:-6px}
#tracklist.grid .row.drop-below::after{right:-6px}
/* settings tabs */
.set-tabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--bg2);margin-bottom:22px;position:sticky;top:-24px;z-index:2;box-shadow:0 -14px 0 10px var(--card),0 10px 0 var(--card)}
.set-tabs button{flex:1;height:34px;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--t3);transition:.15s}
.set-tabs button.on{background:var(--card);color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.06)}

.f-label{font-size:9.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--acc-deep);display:flex;align-items:center;gap:7px;margin-bottom:6px}
.f-label::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--acc)}
.editable{outline:none;border-radius:8px;padding:1px 6px;margin:0 -6px;cursor:text;transition:background .15s;overflow-wrap:anywhere;word-break:keep-all}
.editable:hover,.editable:focus{background:var(--acc-bg)}
.editable:empty::before{content:attr(data-ph);color:var(--t3)}
.capturing .editable:empty,.cap-empty{display:none!important}
#pname{font-family:var(--title-font);font-size:30px;font-weight:var(--title-weight);line-height:1.2;letter-spacing:-.005em;display:inline-block;max-width:100%}
#pdesc{font-size:13px;font-weight:500;color:var(--t2);line-height:1.6;margin-top:4px}
.capturing #pdesc:empty{display:none}

/* pair photo */
.pair{position:relative;margin-top:18px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,var(--acc-bg),var(--acc-light));border:1.5px solid var(--acc-border);aspect-ratio:4/3;cursor:pointer;user-select:none;-webkit-user-select:none}
.pair{background:var(--grad-soft)}
.pair[data-ratio="wide"]{aspect-ratio:16/9}
.pair[data-ratio="square"]{aspect-ratio:1/1}
.pair[data-ratio="tall"]{aspect-ratio:4/5}
.pair::before{content:'';position:absolute;inset:7px;border-radius:inherit;border:1px dashed var(--acc-border);pointer-events:none;z-index:3}
.pair.has-img::before{display:none}
.pair.has-img{cursor:grab;touch-action:none;background:var(--bg2)}
.pair.grabbing{cursor:grabbing}
#pair-img{position:absolute;display:none;max-width:none;pointer-events:none;-webkit-user-drag:none}
.pair.has-img #pair-img{display:block}
.pair-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:2}
.pair.has-img .pair-ph{display:none}
.ph-icon{width:52px;height:52px;border-radius:50%;background:var(--card);border:1.5px solid var(--acc-border);display:flex;align-items:center;justify-content:center;color:var(--acc-deep);box-shadow:0 4px 12px rgba(var(--acc-rgb),.18);margin-bottom:2px}
.pair-ph b{font-size:14px;font-weight:800}
.pair-ph span{font-size:11px;font-weight:600;color:var(--t3)}
.capturing .pair:not(.has-img) .pair-ph{display:none}
.pair-ctrl{position:absolute;right:10px;bottom:10px;z-index:5;display:none;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(0,0,0,.08);opacity:0;transition:opacity .18s}
.pair.has-img .pair-ctrl{display:flex}
.pair:hover .pair-ctrl{opacity:1}
@media (hover:none){.pair.has-img .pair-ctrl{opacity:1}}
.pair-ctrl button{height:28px;min-width:28px;padding:0 8px;border-radius:8px;font-size:11px;font-weight:800;color:var(--t2);display:flex;align-items:center;justify-content:center}
.pair-ctrl button:hover{background:var(--acc-bg);color:var(--acc-deep)}

/* pair names */
.names{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}
.names .editable{font-size:13.5px;font-weight:800;color:var(--t1);min-width:44px;text-align:center}
.link{display:flex;align-items:center;gap:6px;color:var(--acc)}
.link i{width:26px;height:1.5px;background:var(--acc-border);display:block}

/* now playing */
.np{margin-top:16px;padding:14px 14px 12px;border-radius:18px;background:var(--bg2);border:1px solid var(--border)}
.np-row{display:flex;align-items:center;gap:13px}
.disc{position:relative;width:54px;height:54px;border-radius:50%;flex-shrink:0;background:var(--grad);box-shadow:0 3px 10px rgba(var(--acc-rgb),.25);overflow:hidden}
.disc-in{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--acc-deep)}
.disc-in img{width:100%;height:100%;display:block;object-fit:cover}
.disc::after{content:'';position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--bg2);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.np.is-playing .disc-in{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.np-info{flex:1;min-width:0}
.np-top{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.np-label{font-size:9px;font-weight:800;letter-spacing:.2em;color:var(--acc-deep);text-transform:uppercase}
.eq{display:flex;align-items:flex-end;gap:2px;height:10px}
.eq i{display:block;width:2.5px;height:4px;border-radius:2px;background:var(--acc)}
.np:not(.is-playing) .eq{visibility:hidden}
.np.is-playing .eq i{animation:eq 1s ease-in-out infinite}
.np.is-playing .eq i:nth-child(2){animation-delay:-.35s}
.np.is-playing .eq i:nth-child(3){animation-delay:-.7s}
.np.is-playing .eq i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{height:3px}50%{height:10px}}
.np-title{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist{font-size:11.5px;font-weight:600;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.np-ctrl{display:flex;align-items:center;gap:2px}
.nb{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:.15s}
.nb:hover{background:var(--acc-bg);color:var(--acc-deep)}
.nb.main{width:38px;height:38px;background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(var(--acc-rgb),.35);margin:0 2px}
.nb.main:hover{color:#fff;filter:brightness(1.04)}
.np-prog{display:flex;align-items:center;gap:10px;margin-top:11px;font-size:10px;font-weight:700;color:var(--t3);font-variant-numeric:tabular-nums}
.np-prog span{min-width:28px}
.np-prog span:last-child{text-align:right}
.track-bar{flex:1;height:4px;border-radius:2px;background:var(--border2);position:relative;cursor:pointer}
.track-bar::before{content:'';position:absolute;left:0;right:0;top:-8px;bottom:-8px}
.track-fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--grad);width:0}
.track-fill::after{content:'';position:absolute;right:-5px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#fff;border:2px solid var(--acc-deep)}

/* lyrics */

/* tracks */
.divider{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.divider span{font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--t3)}
.divider i{flex:1;height:1.5px;background-image:linear-gradient(to right,var(--border2) 50%,transparent 50%);background-size:6px 1.5px}
#tracklist{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:20px 46px minmax(0,1fr) auto auto;align-items:center;gap:11px;padding:7px 8px;border-radius:14px;cursor:pointer;transition:background .15s;position:relative}
.row:hover{background:var(--bg2)}
.row.sel{background:var(--bg2)}
.capturing .row{background:transparent!important}
.capturing .row.sel{background:var(--bg2)!important}
.row.dragging{opacity:.4}
.row.drop-above::before,.row.drop-below::after{content:'';position:absolute;left:8px;right:8px;height:2px;border-radius:2px;background:var(--acc)}
.row.drop-above::before{top:-1px}.row.drop-below::after{bottom:-1px}
.r-num{font-size:11px;font-weight:700;color:var(--t3);text-align:right;font-variant-numeric:tabular-nums;display:flex;justify-content:flex-end}
.r-num .pl{display:none;color:var(--acc-deep)}
.row:hover .r-num .n{display:none}
.row:hover .r-num .pl{display:flex}
.capturing .r-num .n{display:inline!important}
.capturing .r-num .pl{display:none!important}
.r-art{width:46px;height:46px;border-radius:12px;overflow:hidden;background:var(--grad-soft);display:flex;align-items:center;justify-content:center;color:var(--acc-deep);box-shadow:0 2px 8px rgba(var(--acc-rgb),.16)}
.r-art img{width:100%;height:100%;display:block;object-fit:cover}
.r-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.row.cur .r-title{color:var(--acc-ink)}
.r-artist{font-size:11px;font-weight:600;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-fav,.r-more{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t3);transition:.15s}
.r-fav:hover,.r-more:hover{background:var(--acc-bg);color:var(--acc-deep)}
.r-fav.on{color:var(--acc-deep)}
.r-fav.on path{fill:currentColor}
.r-fav:not(.on){opacity:0}
.r-more{opacity:0}
.row:hover .r-fav,.row:hover .r-more{opacity:1}
@media (hover:none){.r-more{opacity:.7}.r-fav:not(.on){opacity:.45}}
.capturing .r-fav:not(.on){visibility:hidden}
.empty{text-align:center;padding:36px 20px;border:1.5px dashed var(--acc-border);border-radius:18px}
.empty .e-ic{width:46px;height:46px;border-radius:50%;background:var(--card);border:1.5px solid var(--acc-border);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--acc-deep)}
.empty b{display:block;font-size:13.5px;font-weight:800;margin-bottom:4px}
.empty span{font-size:11.5px;font-weight:600;color:var(--t3)}

.f-foot{display:flex;justify-content:center;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--acc-bg);border:1.5px solid var(--acc-border);border-radius:100px;padding:5px 13px;font-size:10.5px;font-weight:800;color:var(--acc-deep);letter-spacing:.06em}

.capturing .no-cap{display:none!important}
.hide{display:none!important}

/* ─── MODAL (bottom sheet) ─── */
.modal-bg{display:none;position:fixed;inset:0;z-index:500;background:rgba(58,34,48,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;padding:14px 22px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(58,34,48,.16);animation:up .3s cubic-bezier(.32,1.2,.6,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.grip{width:38px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 16px}
.m-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.m-top h2{font-size:17px;font-weight:800}
.m-x{width:30px;height:30px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--t2)}
.m-x:hover{background:var(--acc-bg);color:var(--acc-deep)}
.fg{margin-bottom:12px}
.fg>label{display:block;font-size:10px;font-weight:800;color:var(--t2);letter-spacing:.1em;margin-bottom:6px}
.fg>label em{font-style:normal;font-weight:600;letter-spacing:0;color:var(--t3)}
.inp{width:100%;padding:11px 13px;font-size:14px;font-weight:500;border:1.5px solid var(--border2);border-radius:12px;background:var(--bg2);outline:none;transition:.18s}
.inp:focus{border-color:var(--acc);background:var(--card);box-shadow:0 0 0 3px var(--acc-light)}
.inp::placeholder{color:var(--t3)}
textarea.inp{resize:vertical;min-height:140px;line-height:1.7}
textarea.inp.short{min-height:104px}
.fg>label .cnt{float:right;font-weight:600;letter-spacing:0;color:var(--t3)}
.f-row{display:flex;gap:12px}
.f-row .grow{flex:1;min-width:0}
.thumb{position:relative;width:96px;height:96px;flex-shrink:0;border-radius:14px;border:1.5px dashed var(--border2);background:var(--bg2);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--acc-deep);font-size:10.5px;font-weight:700;cursor:pointer;margin-top:19px}
.thumb span{color:var(--t3)}
.thumb:hover{border-color:var(--acc);background:var(--acc-bg)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.thumb.has{border-style:solid}
.thumb.has img{display:block}
.thumb-x{position:absolute;top:5px;right:5px;z-index:2;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.95);display:none;align-items:center;justify-content:center;color:var(--t2);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.thumb.has .thumb-x{display:flex}
.status{font-size:11px;font-weight:700;padding:8px 12px;border-radius:10px;margin:-4px 0 12px;display:none}
.status.load{display:block;background:var(--bg2);color:var(--t2)}
.status.err{display:block;background:#fff0f3;color:#e0445f}
.status.ok{display:block;background:#effaf3;color:#259055}
.m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn-ghost{height:42px;padding:0 16px;border-radius:12px;border:1.5px solid var(--border2);font-size:13px;font-weight:700;color:var(--t2)}
.btn-ghost:hover{background:var(--bg2)}
.btn-pri{height:42px;padding:0 18px;border-radius:12px;background:var(--grad);color:#fff;font-size:13px;font-weight:800;box-shadow:0 3px 10px rgba(var(--acc-rgb),.32)}
.btn-pri:hover{filter:brightness(1.04)}

/* ─── SHARE / VIEW MODE ─── */
.sh-desc{font-size:12.5px;font-weight:600;color:var(--t2);line-height:1.65;margin:-4px 0 10px}
#sh-opts{margin-bottom:14px}
.sh-link{position:relative}
.sh-link .inp{padding-right:78px;font-size:12.5px;color:var(--t2);text-overflow:ellipsis}
.sh-link span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:700;color:var(--t3)}
#share .status{margin:10px 0 0}
.vo{display:none!important}
.view-only .vo{display:flex!important}
.view-note{display:none}
.view-only .view-note{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--border2);font-size:12px;font-weight:600;color:var(--t2);line-height:1.5}
.view-note button{flex-shrink:0;height:30px;padding:0 11px;border-radius:9px;border:1px solid var(--border2);font-size:11.5px;font-weight:700;color:var(--acc-ink);background:var(--acc-bg);white-space:nowrap}
.view-only #btn-add,.view-only #btn-set,.view-only .r-more,.view-only .lyr-edit,.view-only .pair-ctrl,.view-only .lyr.no-cap{display:none!important}
.view-only .editable{cursor:default}
.view-only .editable:hover,.view-only .editable:focus{background:none}
.view-only .editable:empty{display:none}
.view-only .r-fav{pointer-events:none}
.view-only .r-fav:not(.on){display:none}
.view-only .pair,.view-only .pair.has-img{cursor:default}
.view-only .pair:not(.has-img) .pair-ph{display:none}
@media (max-width:480px){.view-only .view-note{flex-direction:column;align-items:stretch;text-align:center}}

/* ─── SETTINGS PANEL ─── */
.set-bg{display:none;position:fixed;inset:0;z-index:400;background:rgba(58,34,48,.16)}
.set-bg.open{display:block}
.set{position:fixed;top:0;right:0;bottom:0;z-index:450;width:320px;max-width:88vw;background:var(--card);padding:24px 22px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;box-shadow:-4px 0 28px rgba(0,0,0,.08);transform:translateX(105%);visibility:hidden;transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s .28s}
.set.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s}
.set-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.set-top h2{font-size:17px;font-weight:800}
.sb{margin-bottom:24px}
.sb h3{font-size:12px;font-weight:700;color:var(--t2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.sb h3 small{font-size:11px;font-weight:600;color:var(--t3)}
.set-note{font-size:11px;font-weight:600;color:var(--t3);line-height:1.6;margin-top:10px}
/* segmented */
#set-body .seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--bg2)}
#set-body .seg button{flex:1;min-width:0;height:32px;border-radius:9px;border:none;font-size:12px;font-weight:700;color:var(--t3);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s}
#set-body .seg button:hover{color:var(--t2)}
#set-body .seg button.on{background:var(--card);color:var(--t1);box-shadow:0 1px 3px rgba(58,34,48,.1)}
#set-body .seg button i{width:10px;height:10px;border-radius:50%;border:1px solid var(--border2);display:block;flex-shrink:0}
/* swatches */
.sw-grid,.gp-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.sw,.gp{aspect-ratio:1/1;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px rgba(58,34,48,.08);transition:transform .15s,box-shadow .15s}
.sw:hover,.gp:hover{transform:scale(1.08)}
.sw.on,.gp.on{box-shadow:0 0 0 2px var(--t1)}
.cc-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:0 6px 0 12px;height:40px;border-radius:11px;border:1px solid var(--border2);font-size:12.5px;font-weight:600;color:var(--t2);cursor:pointer}
.cc-row input{width:26px;height:26px;border:none;border-radius:50%;padding:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none;overflow:hidden}
.cc-row input::-webkit-color-swatch-wrapper{padding:0}
.cc-row input::-webkit-color-swatch{border:none;border-radius:50%}
.cc-row input::-moz-color-swatch{border:none;border-radius:50%}
.sub{font-size:11px;font-weight:600;color:var(--t3);margin:14px 0 8px}
.grad-bar{height:6px;border-radius:3px;background:var(--grad);margin-top:12px}
/* toggles */
.tg{display:flex;align-items:center;justify-content:space-between;height:44px;font-size:13px;font-weight:600;color:var(--t1);cursor:pointer;border-bottom:1px solid var(--border)}
.tg:last-child{border-bottom:none}
.tg.bare{height:auto;border:none;padding-bottom:2px}
.tg input{display:none}
.tg span.sw2{width:36px;height:21px;border-radius:11px;background:var(--border2);position:relative;transition:.18s;flex-shrink:0}
.tg span.sw2::after{content:'';position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:.18s}
.tg input:checked+span.sw2{background:var(--acc-deep)}
.tg input:checked+span.sw2::after{left:18px}
/* thumbnail pickers (filter / effect) */
.pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.pick-grid.c3{grid-template-columns:repeat(3,1fr)}
.pick-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--t3);min-width:0}
.pick-grid button i,.pick-grid button canvas{display:block;width:100%;border-radius:10px;background:var(--grad-soft);background-size:cover;background-position:center;transition:box-shadow .15s}
.pick-grid button i{aspect-ratio:1/1}
.pick-grid button canvas{aspect-ratio:2/1;height:auto}
.pick-grid button:hover i,.pick-grid button:hover canvas{box-shadow:0 0 0 1px var(--border2)}
.pick-grid button.on{color:var(--acc-ink)}
.pick-grid button.on i,.pick-grid button.on canvas{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--acc-deep)}
/* fonts */
.font-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.font-grid button{height:62px;border-radius:12px;border:1px solid var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden;padding:0 8px;transition:.15s}
.font-grid button b{font-size:17px;line-height:1.25;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.font-grid button span{font-size:10.5px;font-weight:600;color:var(--t3)}
.font-grid button:hover{border-color:var(--acc)}
.font-grid button.on{border-color:var(--acc-deep);background:var(--acc-bg)}
.font-grid button.on span{color:var(--acc-ink)}
/* data */
.data-btns{display:grid;gap:8px}
.data-btns button{height:42px;border-radius:11px;border:1px solid var(--border2);font-size:12.5px;font-weight:700;color:var(--t2);transition:.15s}
.data-btns button:hover{background:var(--bg2);border-color:var(--acc)}
.data-btns button.danger{color:#d9546c}
.data-btns button.danger:hover{background:#fff0f3;border-color:#f7c1cc}

/* popover menu */
.menu{position:fixed;z-index:600;min-width:160px;padding:5px;background:var(--card);border:1.5px solid var(--border2);border-radius:14px;box-shadow:0 12px 32px rgba(58,34,48,.12);display:none}
.menu.open{display:block;animation:up .15s ease-out}
.menu button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--t1);text-align:left}
.menu button:hover{background:var(--acc-bg)}
.menu button .ic{color:var(--t3)}
.menu button small{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--t3)}
.menu button.danger,.menu button.danger .ic{color:#e0445f}
.menu hr{border:none;height:1px;background:var(--border);margin:4px 6px}

.toast{position:fixed;left:50%;bottom:28px;z-index:700;transform:translate(-50%,10px);background:var(--t1);color:#fff;font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#yt-host{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1;overflow:hidden}

@media (max-width:480px){
  .wrap{padding:0 12px 44px}
  .bar-label{letter-spacing:.1em;font-size:9.5px}
  .frame{padding:22px 16px 18px;border-radius:24px}
  #pname{font-size:25px}
  .row{grid-template-columns:18px 42px minmax(0,1fr) auto auto;gap:9px;padding:6px 4px}
  .r-art{width:42px;height:42px;border-radius:11px}
  .np{padding:12px}
  .np-row{gap:10px}
  .disc{width:48px;height:48px}
  .nb{width:28px;height:28px}
  .nb.main{width:36px;height:36px}
}
@media (max-width:350px){
  .bar-label{letter-spacing:.03em;font-size:9px;gap:5px}
  .bar-btns{gap:5px}
  .ico-btn{width:34px;height:34px}
  .add-btn{padding:0 11px}
}
</style>
</head>
<body>
<div class="bg-deco" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div></div>

<div class="wrap">
  <header class="bar">
    <span class="bar-label">Music Playlist Editor</span>
    <div class="bar-btns">
      <button class="ico-btn" id="btn-share" title="공유"></button>
      <button class="ico-btn" id="btn-save" title="이미지 저장"></button>
      <button class="add-btn vo" id="btn-mine">새로 만들기</button>
      <button class="ico-btn" id="btn-set" title="설정"></button>
      <button class="add-btn" id="btn-add"></button>
    </div>
  </header>

  <div class="view-note" id="view-note">공유받은 플레이리스트예요. 곡을 누르면 바로 들을 수 있어요.<button id="btn-take">내 편집기로 가져오기</button></div>
  <div id="snap">
    <article class="frame" id="frame">
      <div class="f-label">playlist</div>
      <div id="pname" class="editable" contenteditable="true" spellcheck="false" data-ph="플레이리스트 이름"></div>
      <div id="pdesc" class="editable" contenteditable="true" spellcheck="false" data-ph="소개를 입력하세요"></div>

      <div class="pair" id="pair">
        <img id="pair-img" alt="" draggable="false">
        <div class="pair-ph"><div class="ph-icon" id="ph-icon"></div><b>사진 넣기</b><span>클릭해서 업로드</span></div>
        <div class="pair-ctrl no-cap" id="pair-ctrl">
          <button data-p="change">변경</button>
          <button data-p="out" title="축소 (Ctrl + 휠로도 조절)">−</button>
          <button data-p="in" title="확대">+</button>
          <button data-p="reset">초기화</button>
          <button data-p="remove">삭제</button>
        </div>
        <input type="file" id="pair-file" accept="image/*" hidden>
      </div>

      <div class="names" id="names">
        <div class="editable" id="name-a" contenteditable="true" spellcheck="false" data-ph="이름"></div>
        <span class="link"><i></i><span id="link-ic"></span><i></i></span>
        <div class="editable" id="name-b" contenteditable="true" spellcheck="false" data-ph="이름"></div>
      </div>

      <section class="np" id="np">
        <div class="np-row">
          <div class="disc"><div class="disc-in" id="np-disc"></div></div>
          <div class="np-info">
            <div class="np-top"><span class="np-label">now playing</span><span class="eq" id="np-eq"><i></i><i></i><i></i><i></i></span></div>
            <div class="np-title" id="np-title"></div>
            <div class="np-artist" id="np-artist"></div>
          </div>
          <div class="np-ctrl">
            <button class="nb" id="btn-prev" title="이전 곡"></button>
            <button class="nb main" id="btn-play" title="재생"></button>
            <button class="nb" id="btn-next" title="다음 곡"></button>
          </div>
        </div>
        <div class="np-prog">
          <span id="np-cur">0:00</span>
          <div class="track-bar" id="np-bar"><div class="track-fill" id="np-fill"></div></div>
          <span id="np-dur">0:00</span>
        </div>
      </section>

      <section class="lyr" id="lyr">
        <button class="lyr-edit no-cap" id="lyr-edit" title="가사 구절 편집"></button>
        <div id="lyr-body"></div>
      </section>

      <div class="divider"><i></i><span>tracks</span><i></i></div>
      <div id="tracklist"></div>

      <div class="f-foot"><span class="pill" id="pill"></span></div>
    </article>
  </div>
</div>

<!-- Track modal -->
<div class="modal-bg" id="modal">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="grip"></div>
    <div class="m-top"><h2 id="m-title">트랙 추가</h2><button class="m-x" data-close="modal" title="닫기"></button></div>
    <div class="fg"><label>유튜브 링크 <em>(붙여 넣으면 자동 입력)</em></label><input class="inp" id="f-link" type="url" placeholder="https://youtu.be/..."></div>
    <div class="status" id="f-status"></div>
    <div class="f-row">
      <div class="grow">
        <div class="fg"><label>제목</label><input class="inp" id="f-title" type="text" placeholder="제목"></div>
        <div class="fg"><label>아티스트</label><input class="inp" id="f-artist" type="text" placeholder="아티스트"></div>
      </div>
      <div class="thumb" id="thumb" title="앨범 커버">
        <img id="thumb-img" alt="">
        <span id="thumb-ic"></span><span>앨범 커버</span>
        <button class="thumb-x" id="thumb-x" type="button" title="지우기"></button>
        <input type="file" id="thumb-file" accept="image/*" hidden>
      </div>
    </div>
    <div class="fg"><label>이미지 링크 <em>(선택)</em></label><input class="inp" id="f-img" type="url" placeholder="https://..."></div>
    <div class="fg" style="margin-bottom:0"><label>가사 구절 <em>(선택 · 좋아하는 부분만)</em><span class="cnt" id="f-cnt">0/200</span></label><textarea class="inp short" id="f-lyrics" maxlength="200" rows="4" placeholder="기억에 남는 구절을 짧게 적어 주세요"></textarea></div>
    <div class="m-foot"><button class="btn-ghost" data-close="modal">취소</button><button class="btn-pri" id="f-submit">추가하기</button></div>
  </div>
</div>

<!-- Share -->
<div class="modal-bg" id="share">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="grip"></div>
    <div class="m-top"><h2>플레이리스트 공유</h2><button class="m-x" id="sh-x" title="닫기"></button></div>
    <p class="sh-desc" id="sh-desc">링크를 받은 사람은 이 플레이리스트를 그대로 보고, 유튜브 링크가 있는 곡을 바로 들을 수 있어요. 받은 사람은 내용을 바꿀 수 없어요.</p>
    <div id="sh-opts">
      <label class="tg">사진과 앨범 커버 포함<input type="checkbox" id="sh-img" checked><span class="sw2"></span></label>
      <label class="tg">가사 구절 포함<input type="checkbox" id="sh-ly" checked><span class="sw2"></span></label>
    </div>
    <div class="sh-link"><input class="inp" id="sh-url" readonly><span id="sh-len"></span></div>
    <div class="status" id="sh-status"></div>
    <div class="m-foot"><button class="btn-ghost" id="sh-open">미리 보기</button><button class="btn-ghost" id="sh-native">공유하기</button><button class="btn-pri" id="sh-copy">링크 복사</button></div>
  </div>
</div>

<!-- Settings -->
<div class="set-bg" id="set-bg"></div>
<aside class="set" id="set">
  <div class="set-top"><h2>설정</h2><button class="m-x" id="set-x" title="닫기"></button></div>
  <div class="set-tabs" id="set-tabs"><button data-tab="color" class="on">색상</button><button data-tab="deco">꾸미기</button><button data-tab="fx">효과</button><button data-tab="data">데이터</button></div>
  <div id="set-body"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</aside>

<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>
<div id="yt-host"><div id="yt-player"></div></div>

/* ════ PHOTO FILTERS ════ */
function filterPixels(d,kind){
  const acc=hexRgb(S.accent);
  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2];
    if(kind==='soft'){const l=(r+g+b)/3;r=(r*.88+l*.12)*.9+24;g=(g*.88+l*.12)*.9+22;b=(b*.88+l*.12)*.9+24}
    else if(kind==='warm'){r=r*1.05+10;g=g*1.01+4;b=b*.9}
    else if(kind==='cool'){r=r*.92;g=g+2;b=b*1.05+12}
    else if(kind==='mono'){const l=.3*r+.59*g+.11*b;r=l*.96+10;g=l*.96+7;b=l*.96+6}
    else if(kind==='vintage'){const sr=.393*r+.769*g+.189*b,sg=.349*r+.686*g+.168*b,sb=.272*r+.534*g+.131*b;r=(r*.6+sr*.4)*.86+26;g=(g*.6+sg*.4)*.86+20;b=(b*.6+sb*.4)*.86+18}
    else if(kind==='tint'){r=r*.8+acc[0]*.2+6;g=g*.8+acc[1]*.2+6;b=b*.8+acc[2]*.2+6}
    else if(kind==='bright'){const l=(r+g+b)/3;r=r+(r-l)*.2;g=g+(g-l)*.2;b=b+(b-l)*.2;r=r*1.06+12;g=g*1.06+12;b=b*1.06+12}
    d[i]=r;d[i+1]=g;d[i+2]=b;
  }
}
async function filtered(src,kind,max){
  const img=await loadImg(src);const k=Math.min(1,(max||99999)/Math.max(img.naturalWidth,img.naturalHeight));
  const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
  const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,cv.width,cv.height);
  if(kind!=='none'){const id=x.getImageData(0,0,cv.width,cv.height);filterPixels(id.data,kind);x.putImageData(id,0,0)}
  return cv.toDataURL('image/jpeg',.92);
}

let pm={dw:0,dh:0};
function layoutPhoto(){
  const box=$('pair'),img=$('pair-img');
  if(!S.photo||!img.naturalWidth)return;
  const W=box.clientWidth,H=box.clientHeight,w=img.naturalWidth,h=img.naturalHeight,p=S.photoPos;
  p.z=clamp(p.z||1,1,5);
  const sc=Math.max(W/w,H/h)*p.z,dw=w*sc,dh=h*sc;
  const l=clamp(W/2-p.cx*dw,W-dw,0),t=clamp(H/2-p.cy*dh,H-dh,0);
  p.cx=(W/2-l)/dw;p.cy=(H/2-t)/dh;pm={dw,dh};
  Object.assign(img.style,{width:dw+'px',height:dh+'px',left:l+'px',top:t+'px'});
}
async function showPhoto(){
  const box=$('pair'),img=$('pair-img');
  layoutShape();
  if(!S.photo){box.classList.remove('has-img');img.removeAttribute('src');return}
  box.classList.add('has-img');img.onload=layoutPhoto;
  const req=++R.photoReq,src=await photoSrc();
  if(req!==R.photoReq||!S.photo)return;
  if(img.getAttribute('src')!==src)img.src=src;
  if(img.complete&&img.naturalWidth)layoutPhoto();
}
function bindPhoto(){
  const box=$('pair');
  $('ph-icon').innerHTML=ic('heart',21);
  box.addEventListener('click',e=>{if(R.viewOnly)return;if(!S.photo&&!e.target.closest('.pair-ctrl'))$('pair-file').click()});
  $('pair-file').addEventListener('change',async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    S.photo=await downscale(await readFile(f),1800);S.photoPos={cx:.5,cy:.5,z:1};R.filterThumbs=null;persist();showPhoto();
  });
  $('pair-ctrl').addEventListener('click',e=>{
    const b=e.target.closest('[data-p]');if(!b)return;e.stopPropagation();
    const a=b.dataset.p;
    if(a==='change')$('pair-file').click();
    if(a==='in'){S.photoPos.z*=1.15;layoutPhoto();persistSoon()}
    if(a==='out'){S.photoPos.z/=1.15;layoutPhoto();persistSoon()}
    if(a==='reset'){S.photoPos={cx:.5,cy:.5,z:1};layoutPhoto();persistSoon()}
    if(a==='remove'&&confirm('사진을 삭제할까요?')){S.photo='';R.filterThumbs=null;R.filtered={key:'',url:''};persist();showPhoto()}
  });
  const pt=new Map();let pan=null,pinch=null;
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const start=()=>{const p=[...pt.values()];
    if(p.length===1){pan={x:p[0].x,y:p[0].y,cx:S.photoPos.cx,cy:S.photoPos.cy,...pm};pinch=null}
    else if(p.length>=2){pinch={d:d(p[0],p[1])||1,z:S.photoPos.z};pan=null}};
  box.addEventListener('pointerdown',e=>{if(R.viewOnly||!S.photo||e.target.closest('.pair-ctrl'))return;box.setPointerCapture(e.pointerId);pt.set(e.pointerId,{x:e.clientX,y:e.clientY});box.classList.add('grabbing');start()});
  box.addEventListener('pointermove',e=>{
    if(!pt.has(e.pointerId))return;pt.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const p=[...pt.values()];
    if(pinch&&p.length>=2){S.photoPos.z=pinch.z*d(p[0],p[1])/pinch.d;layoutPhoto()}
    else if(pan&&pan.dw){S.photoPos.cx=pan.cx-(e.clientX-pan.x)/pan.dw;S.photoPos.cy=pan.cy-(e.clientY-pan.y)/pan.dh;layoutPhoto()}
  });
  const end=e=>{if(!pt.delete(e.pointerId))return;if(pt.size)start();else{pan=pinch=null;box.classList.remove('grabbing');persistSoon()}};
  box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  box.addEventListener('wheel',e=>{if(R.viewOnly||!S.photo||!(e.ctrlKey||e.metaKey))return;e.preventDefault();S.photoPos.z*=e.deltaY<0?1.07:1/1.07;layoutPhoto();persistSoon()},{passive:false});
  new ResizeObserver(()=>{layoutShape();layoutPhoto()}).observe(box);
}

window.onYouTubeIframeAPIReady=function(){

  renderAll();

    if(R.cur!==id||!R.playing)return;

    if(st!==1&&st!==3){R.playing=false;renderNP();renderList();toast(R.ytReady?'브라우저가 자동 재생을 막았어요. 재생 버튼을 한 번 더 눌러 주세요':'유튜브 플레이어를 불러오는 중이에요. 잠시 후 다시 눌러 주세요')}

async function fetchYt(id){
  const w='https://www.youtube.com/watch?v='+id;let title='',author='';
  for(const u of[`https://noembed.com/embed?url=${encodeURIComponent(w)}`,`https://www.youtube.com/oembed?url=${encodeURIComponent(w)}&format=json`]){
    try{const r=await fetch(u,{signal:tSignal(6000)});if(r.ok){const d=await r.json();if(d&&d.title&&!d.error){title=d.title;author=d.author_name||'';break}}}catch{}
  }
  let thumb='';
  for(const q of['maxresdefault','sddefault','hqdefault','mqdefault']){
    try{const r=await fetch(`https://i.ytimg.com/vi/${id}/${q}.jpg`,{mode:'cors',signal:tSignal(6000)});
      if(r.ok){const b=await r.blob();if(b.size>3000){const d=await blobToB64(b);thumb=(await cropSquare(d,320,true))||d;break}}}catch{}
  }
  if(!thumb)thumb=`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
  let t=cleanTitle(title),artist='';
  if(t.includes(' - ')){const p=t.split(' - ');artist=p.shift().trim();t=p.join(' - ').trim()}
  else if(/ - Topic$/.test(author))artist=author.replace(/ - Topic$/,'').trim();
  return{title:t,artist,thumb,ok:!!title};
}

/* ════ EFFECTS ════ */
const FX=[['none','없음'],['sparkle','반짝이'],['hearts','하트'],['petals','꽃잎'],['snow','눈'],['bokeh','방울']];
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const TAU=Math.PI*2;
function heartPath(c,x,y,s){
  c.beginPath();c.moveTo(x,y+s*.3);
  c.bezierCurveTo(x,y-s*.05,x-s*.5,y-s*.05,x-s*.5,y+s*.28);

    $('sh-url').value=url;$('sh-len').textContent=url.length.toLocaleString()+'자';
    const s=$('sh-status');
    if(location.protocol==='file:'){s.className='status err';s.textContent='지금은 파일로 열려 있어서 이 링크는 다른 사람이 열 수 없어요. 사이트 주소에 올린 뒤 공유해 주세요.'}
    else if(url.length>12000){s.className='status load';s.textContent='링크가 길어서 일부 메신저에서 잘릴 수 있어요. 사진을 빼면 짧아져요.'}
    else{s.className='status';s.textContent=''}
  }catch(e){console.error(e);$('sh-url').value='';const s=$('sh-status');s.className='status err';s.textContent='링크를 만들지 못했어요'}
}
function openShare(){
  closeMenu();
  if(!R.viewOnly&&!S.tracks.length){toast('곡을 추가한 뒤 공유해 주세요');return}
  $('sh-opts').style.display=R.viewOnly?'none':'';
  $('sh-desc').textContent=R.viewOnly?'받은 링크를 그대로 다른 사람에게 보낼 수 있어요.':'링크를 받은 사람은 이 플레이리스트를 그대로 보고, 유튜브 링크가 있는 곡을 바로 들을 수 있어요. 받은 사람은 내용을 바꿀 수 없어요.';
  $('sh-native').style.display=navigator.share?'':'none';
  $('share').classList.add('open');refreshShare();
}
async function copyText(s){
  try{await navigator.clipboard.writeText(s);return true}catch{}
  try{const i=$('sh-url');i.focus();i.select();i.setSelectionRange(0,s.length);return document.execCommand('copy')}catch{return false}
}
function bindShare(){
  $('btn-share').innerHTML=ic('share',15);$('sh-x').innerHTML=ic('close',14);
  $('btn-share').addEventListener('click',openShare);
  $('sh-x').addEventListener('click',()=>$('share').classList.remove('open'));
  $('share').addEventListener('click',e=>{if(e.target===$('share'))$('share').classList.remove('open')});
  $('sh-img').addEventListener('change',refreshShare);$('sh-ly').addEventListener('change',refreshShare);
  $('sh-copy').addEventListener('click',async()=>{const u=$('sh-url').value;if(!/^(https?|file):/.test(u))return;toast(await copyText(u)?'링크를 복사했어요':'복사하지 못했어요. 링크를 길게 눌러 복사해 주세요')});
  $('sh-native').addEventListener('click',async()=>{const u=$('sh-url').value;if(!/^(https?|file):/.test(u))return;try{await navigator.share({title:S.name,url:u})}catch{}});
  $('sh-open').addEventListener('click',()=>{const u=$('sh-url').value;if(/^(https?|file):/.test(u))window.open(u,'_blank','noopener')});
  $('sh-url').addEventListener('focus',e=>e.target.select());
  $('btn-mine').addEventListener('click',()=>{location.href=location.href.split('#')[0]});
  $('btn-take').addEventListener('click',()=>{
    let has=false;try{const o=JSON.parse(localStorage.getItem(KEY));has=o&&o.tracks&&o.tracks.length}catch{}
    if(has&&!confirm('내 편집기에 있던 플레이리스트가 이 내용으로 바뀌어요. 계속할까요?'))return;
    try{localStorage.setItem(KEY,JSON.stringify({...S,lyrVer:2}));location.href=location.href.split('#')[0]}
    catch{toast('저장 공간이 부족해서 가져오지 못했어요')}
  });
  addEventListener('hashchange',()=>location.reload());
}

/* ════ BOOT ════ */
async function normalizeThumbs(){
  if(R.viewOnly)return;
  let ch=false;
  for(const t of S.tracks){
    if(!t.thumb)continue;
    try{const img=await withTimeout(loadImg(t.thumb),8000);
      if(img.naturalWidth!==img.naturalHeight||img.naturalWidth>480){const sq=await cropSquare(t.thumb,320,!!t.ytId);if(sq){t.thumb=sq;ch=true}}}catch{}
  }
  if(ch){persist();renderAll()}
}
function boot(){applyTheme();showPhoto();renderAll();placeFx()}
function init(){
  $('btn-save').innerHTML=ic('download',15);$('btn-set').innerHTML=ic('settings',15);
  $('btn-add').innerHTML=ic('plus',12)+'추가';$('btn-mine').innerHTML=ic('plus',12)+'새로 만들기';$('link-ic').innerHTML=ic('heartF',12);
  document.querySelectorAll('[data-close]').forEach(b=>{if(b.classList.contains('m-x'))b.innerHTML=ic('close',14);b.addEventListener('click',closeModal)});
  bindEditable($('pname'),()=>S.name,v=>S.name=v,'My Playlist');
  bindEditable($('pdesc'),()=>S.desc,v=>S.desc=v,'');
  bindEditable($('name-a'),()=>S.names[0],v=>S.names[0]=v,'');
  bindEditable($('name-b'),()=>S.names[1],v=>S.names[1]=v,'');
  bindPhoto();bindLyrics();bindList();bindMenu();bindPlayer();bindModal();bindSettings();bindShare();
  $('btn-add').addEventListener('click',()=>openModal());
  $('btn-set').addEventListener('click',openSet);
  $('btn-save').addEventListener('click',e=>{
    if($('menu').classList.contains('open')&&R.menuFor==='save'){closeMenu();return}
    R.menuFor='save';
    openMenu(null,e.currentTarget,[['png','image','PNG 저장','','이미지'],['gif','film','GIF 저장','',S.fx==='none'?'움직이는 이미지':'효과: '+FX.find(f=>f[0]===S.fx)[1]]]);
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeMenu();closeModal();closeSet();$('share').classList.remove('open');return}
    const a=document.activeElement;
    if(a&&(a.isContentEditable||/INPUT|TEXTAREA|SELECT|BUTTON/.test(a.tagName)))return;
    if($('modal').classList.contains('open')||$('set').classList.contains('open')||$('share').classList.contains('open'))return;
    if(e.code==='Space'&&S.tracks.length){e.preventDefault();togglePlay()}
  });
  if(/^#p=/.test(location.hash)){
    readShare(location.hash).then(st=>{if(st)enterView(st);boot();loadYT()}).catch(e=>{console.error(e);boot();normalizeThumbs();loadYT();toast(e&&e.message==='nodecomp'?'이 브라우저에서는 공유 링크를 열 수 없어요':'공유 링크가 잘렸거나 올바르지 않아요')});
    return;
  }
  boot();normalizeThumbs();loadYT();
}
document.addEventListener('DOMContentLoaded',init);
</script>
